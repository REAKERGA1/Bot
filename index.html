<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 UAH Clicker</title>
    <style>
        body { background: #1a1a2e; color: white; text-align: center; font-family: sans-serif; }
        .stat { font-size: 24px; color: gold; margin: 20px; }
        button { padding: 20px 40px; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>💰 UAH Clicker</h1>
    <p id="user-display">Loading user...</p>
    <div class="stat">Balance: <span id="balance">0.00</span></div>
    <button id="clickBtn">CLICK ME</button>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Detect user
        let user = tg.initDataUnsafe?.user;
        document.getElementById('user-display').textContent = user ? "Welcome, " + user.first_name : "Not inside Telegram";

        // Logic
        let balance = 0.00;
        document.getElementById('clickBtn').onclick = () => {
            balance += 0.01;
            document.getElementById('balance').textContent = balance.toFixed(2);
            
            // This sends the data to the bot
            tg.sendData(JSON.stringify({ action: 'click' }));
        };
    </script>
</body>
</html>
