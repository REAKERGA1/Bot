<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAH Clicker</title>
    <style>
        body { background: #1a1a2e; color: white; text-align: center; font-family: sans-serif; }
        .stat { font-size: 20px; color: gold; }
    </style>
</head>
<body>
    <h1>💰 UAH Clicker</h1>
    <p id="user-display">Checking user...</p>
    <div class="stat">Balance: <span id="balance">0.00</span> UAH</div>
    <button id="clickButton" style="padding: 20px; font-size: 20px;">CLICK TO EARN</button>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // 1. Properly detect user
        let user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-display').textContent = "Welcome, @" + (user.username || user.first_name);
        } else {
            document.getElementById('user-display').textContent = "Welcome, Guest (Open in Telegram to see your name)";
        }

        // 2. Local update logic
        let balance = 0.00;
        document.getElementById('clickButton').onclick = () => {
            balance += 0.01;
            document.getElementById('balance').textContent = balance.toFixed(2);
            
            // Send data to bot without "connecting"
            tg.sendData(JSON.stringify({ action: 'click' }));
        };
    </script>
</body>
</html>
