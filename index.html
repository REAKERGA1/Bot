<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💰 UAH Clicker Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Animated Background */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(72, 0, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(255, 0, 128, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(0, 255, 200, 0.05) 0%, transparent 50%);
        }

        /* Floating particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) rotate(720deg);
                opacity: 0;
            }
        }

        .game-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 215, 0, 0.05));
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.1);
        }

        .header h1 {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(45deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        .user-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 5px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        .user-info .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFD700, #FF6B00);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
        }

        .stat-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.02);
        }

        .stat-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #FFD700;
        }

        .stat-value.balance {
            font-size: 28px;
            color: #00FF88;
        }

        /* Progress Bar */
        .progress-section {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 5px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FFD700, #FF6B00, #FF0080);
            border-radius: 10px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }

        /* Main Click Button */
        .click-button-wrapper {
            position: relative;
            margin: 20px 0;
            display: flex;
            justify-content: center;
        }

        .click-button {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: none;
            background: radial-gradient(circle at 30% 30%, #FFD700, #FF6B00);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            transition: all 0.1s;
            box-shadow: 
                0 10px 30px rgba(255, 215, 0, 0.3),
                inset 0 -5px 15px rgba(0, 0, 0, 0.3),
                inset 0 5px 15px rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            user-select: none;
            touch-action: manipulation;
        }

        .click-button::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #FFD700, #FF6B00, #FF0080, #FFD700);
            opacity: 0.3;
            z-index: -1;
            animation: rotate 3s linear infinite;
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .click-button:active {
            transform: scale(0.92);
        }

        .click-button .coin-icon {
            font-size: 48px;
        }

        .click-button .click-text {
            font-size: 16px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .click-button .click-earn {
            font-size: 12px;
            opacity: 0.8;
        }

        /* Click animation */
        .click-ripple {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.4), transparent);
            animation: ripple 0.8s ease-out forwards;
        }

        @keyframes ripple {
            0% {
                width: 0;
                height: 0;
                opacity: 1;
                transform: translate(-50%, -50%) scale(0);
            }
            100% {
                width: 300px;
                height: 300px;
                opacity: 0;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* Floating +0.01 text */
        .float-text {
            position: fixed;
            pointer-events: none;
            font-size: 24px;
            font-weight: bold;
            color: #00FF88;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(1.5);
            }
        }

        /* Bottom Menu */
        .bottom-menu {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .menu-btn {
            padding: 12px;
            border: none;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .menu-btn:active {
            transform: scale(0.95);
        }

        .menu-btn .icon {
            font-size: 20px;
            display: block;
            margin-bottom: 3px;
        }

        /* Notification for bot communication */
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #00FF88;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 1000;
            display: none;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .notification.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .game-container {
                padding: 15px;
                border-radius: 20px;
            }

            .click-button {
                width: 160px;
                height: 160px;
            }

            .click-button .coin-icon {
                font-size: 38px;
            }

            .stat-value.balance {
                font-size: 22px;
            }

            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="particles" id="particles"></div>

    <!-- Notification -->
    <div class="notification" id="notification"></div>

    <div class="game-container">
        <!-- Header -->
        <div class="header">
            <h1>💰 UAH CLICKER</h1>
            <div class="user-info">
                <div class="avatar">👤</div>
                <span id="username">Loading...</span>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">💰 Balance</div>
                <div class="stat-value balance" id="balance">0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">🖱️ Total Clicks</div>
                <div class="stat-value" id="totalClicks">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">🔥 Session Clicks</div>
                <div class="stat-value" id="sessionClicks">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">⚡ Streak</div>
                <div class="stat-value" id="streak">0x</div>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-section">
            <div class="progress-label">
                <span>🎯 Click Progress</span>
                <span id="progressText">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <!-- Main Click Button -->
        <div class="click-button-wrapper">
            <button class="click-button" id="clickButton">
                <span class="coin-icon">🪙</span>
                <span class="click-text">CLICK TO EARN</span>
                <span class="click-earn">+0.01 UAH</span>
            </button>
        </div>

        <!-- Bottom Menu -->
        <div class="bottom-menu">
            <button class="menu-btn" onclick="refreshStats()">
                <span class="icon">🔄</span>
                Refresh
            </button>
            <button class="menu-btn" onclick="showLeaderboard()">
                <span class="icon">🏆</span>
                Leaderboard
            </button>
            <button class="menu-btn" onclick="resetSession()">
                <span class="icon">🆕</span>
                New Session
            </button>
        </div>
    </div>

    <script>
        // Game state
        let userData = {
            username: 'Player',
            balance: 0,
            total_clicks: 0,
            session_clicks: 0,
            click_streak: 0,
            max_streak: 0,
            total_earned: 0
        };

        let telegramUser = null;
        let tg = null;

        // Show notification
        function showNotification(message, isError = false) {
            const notif = document.getElementById('notification');
            notif.textContent = message;
            notif.style.color = isError ? '#FF4444' : '#00FF88';
            notif.classList.add('show');
            setTimeout(() => {
                notif.classList.remove('show');
            }, 3000);
        }

        // Initialize Telegram Web App
        function initTelegram() {
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                telegramUser = tg.initDataUnsafe.user;
                
                if (telegramUser) {
                    userData.username = telegramUser.username || 
                                       telegramUser.first_name || 
                                       'Player';
                    document.getElementById('username').textContent = '@' + userData.username;
                }
                
                // Expand the app to full screen
                tg.ready();
                tg.expand();
                
                // Set up message listener for bot responses
                tg.onEvent('message', function(data) {
                    try {
                        const parsed = JSON.parse(data);
                        if (parsed.action === 'update') {
                            updateStats(parsed.data);
                            showNotification('✅ Stats updated!');
                        } else if (parsed.action === 'leaderboard') {
                            alert(parsed.data);
                        }
                    } catch (e) {
                        console.error('Error parsing message:', e);
                    }
                });
                
                // Load user data from bot
                loadUserData();
            } else {
                // Fallback for testing
                document.getElementById('username').textContent = '@TestUser';
                showNotification('⚠️ Running in test mode');
                loadUserData();
            }
        }

        // Load user data from bot
        function loadUserData() {
            if (tg) {
                tg.sendData(JSON.stringify({
                    action: 'getData'
                }));
            }
        }

        // Update stats from bot
        function updateStats(data) {
            userData = data;
            document.getElementById('balance').textContent = data.balance.toFixed(2);
            document.getElementById('totalClicks').textContent = data.total_clicks.toLocaleString();
            document.getElementById('sessionClicks').textContent = data.session_clicks.toLocaleString();
            document.getElementById('streak').textContent = data.click_streak + 'x';
            
            // Update progress
            const progress = Math.min((data.session_clicks % 100) / 100 * 100, 100);
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').textContent = Math.round(progress) + '%';
        }

        // Handle click
        function handleClick(event) {
            // Create ripple effect
            const ripple = document.createElement('div');
            ripple.className = 'click-ripple';
            ripple.style.left = event.clientX + 'px';
            ripple.style.top = event.clientY + 'px';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 800);

            // Create floating +0.01 text
            const floatText = document.createElement('div');
            floatText.className = 'float-text';
            floatText.textContent = '+0.01 UAH';
            floatText.style.left = (event.clientX + (Math.random() - 0.5) * 60) + 'px';
            floatText.style.top = (event.clientY - 20) + 'px';
            document.body.appendChild(floatText);
            setTimeout(() => floatText.remove(), 1000);

            // Send click to bot
            if (tg) {
                tg.sendData(JSON.stringify({
                    action: 'click'
                }));
                showNotification('💰 +0.01 UAH!');
            } else {
                showNotification('⚠️ Bot not connected!', true);
            }
        }

        // Refresh stats
        function refreshStats() {
            if (tg) {
                tg.sendData(JSON.stringify({
                    action: 'refresh'
                }));
                showNotification('🔄 Refreshing...');
            } else {
                showNotification('⚠️ Bot not connected!', true);
            }
        }

        // Show leaderboard
        function showLeaderboard() {
            if (tg) {
                tg.sendData(JSON.stringify({
                    action: 'leaderboard'
                }));
                showNotification('🏆 Loading leaderboard...');
            } else {
                showNotification('⚠️ Bot not connected!', true);
            }
        }

        // Reset session
        function resetSession() {
            if (confirm('Reset this session? Your total balance will be preserved.')) {
                if (tg) {
                    tg.sendData(JSON.stringify({
                        action: 'reset'
                    }));
                    showNotification('🆕 Session reset!');
                } else {
                    showNotification('⚠️ Bot not connected!', true);
                }
            }
        }

        // Event listener for click button
        document.getElementById('clickButton').addEventListener('click', handleClick);
        document.getElementById('clickButton').addEventListener('touchstart', function(e) {
            e.preventDefault();
            const touch = e.touches[0];
            handleClick({ clientX: touch.clientX, clientY: touch.clientY });
        });

        // Generate particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (10 + Math.random() * 20) + 's';
                particle.style.animationDelay = (Math.random() * 20) + 's';
                particle.style.width = (2 + Math.random() * 4) + 'px';
                particle.style.height = particle.style.width;
                container.appendChild(particle);
            }
        }

        // Initialize
        createParticles();
        initTelegram();
    </script>
</body>
</html>
