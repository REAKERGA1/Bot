<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAH Clicker</title>
    <style>
        body {
            background: radial-gradient(circle at center, #1e1e3f, #0f0f1a);
            color: white;
            text-align: center;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 { margin-bottom: 30px; letter-spacing: 2px; }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            margin-bottom: 40px;
        }

        .stat { font-size: 32px; font-weight: bold; color: #ffd700; }

        button {
            padding: 25px 60px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 10px 20px rgba(110, 142, 251, 0.4);
        }

        button:active {
            transform: scale(0.95);
            box-shadow: 0 5px 10px rgba(110, 142, 251, 0.6);
        }
    </style>
</head>
<body>

    <h1>💰 UAH Clicker</h1>

    <div class="stat-card">
        Balance<br>
        <span id="balance" class="stat">0.00</span> UAH
    </div>

    <button id="clickBtn">TAP TO MINE</button>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        let balance = parseFloat(urlParams.get('balance')) || parseFloat(localStorage.getItem("balance")) || 0;

        const balanceText = document.getElementById("balance");

        function updateBalance() {
            balanceText.textContent = balance.toFixed(2);
            localStorage.setItem("balance", balance);
        }

        updateBalance();

        document.getElementById("clickBtn").addEventListener("click", () => {
            balance += 0.01;
            updateBalance();
            try {
                tg.sendData(JSON.stringify({ action: "click", balance: balance }));
            } catch (e) { console.log(e); }
        });
    </script>
</body>
</html>
